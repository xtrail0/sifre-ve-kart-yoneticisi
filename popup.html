<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-tertiary: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
      --danger: #ef4444;
      --success: #10b981;
      --border: #334155;
      --radius: 10px;
    }

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif; }
    body { width: 380px; padding: 14px; margin: 0; background-color: var(--bg-primary); color: var(--text-main); }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg-primary); }
    ::-webkit-scrollbar-thumb { background: var(--bg-tertiary); border-radius: 4px; }

    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .header h2 { font-size: 15px; font-weight: 700; margin: 0; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .tabs { display: flex; background-color: var(--bg-secondary); padding: 4px; border-radius: var(--radius); gap: 4px; margin-bottom: 12px; border: 1px solid var(--border); }
    .tab-btn { flex: 1; padding: 7px 2px; font-size: 10.5px; font-weight: 600; background: transparent; color: var(--text-muted); border: none; border-radius: 7px; cursor: pointer; transition: all 0.2s ease; }
    .tab-btn.active { background: var(--accent-gradient); color: #ffffff; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25); }

    .tab-content { display: none; }
    .tab-content.active { display: block !important; }

    .card { background: var(--bg-secondary); padding: 10px; border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 10px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2); }
    label { font-size: 11px; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    .output-box { display: flex; gap: 6px; margin-bottom: 8px; }

    input[type="text"], input[type="password"], textarea {
      width: 100%; padding: 8px 10px; font-size: 13px; background-color: #0b1120; color: var(--text-main); border: 1px solid var(--border); border-radius: 6px; outline: none; transition: border-color 0.2s;
    }
    textarea { resize: vertical; min-height: 60px; font-family: inherit; }
    input[type="text"]:focus, input[type="password"]:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); }

    .slider-container { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; background: #0b1120; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); }
    .slider-container input[type="range"] { flex: 1; cursor: pointer; accent-color: var(--accent); }
    .slider-val { font-weight: 700; color: var(--accent); min-width: 22px; text-align: right; font-size: 12px; }

    .checkbox-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
    .checkbox-label { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-main); text-transform: none; margin: 0; cursor: pointer; user-select: none; }
    .checkbox-label input[type="checkbox"] { cursor: pointer; accent-color: var(--accent); }

    button { font-size: 11px; font-weight: 600; border: none; border-radius: 6px; cursor: pointer; transition: all 0.2s ease; }
    button.btn-primary { background: var(--accent-gradient); color: #ffffff; padding: 7px 10px; }
    button.btn-primary:hover { opacity: 0.95; transform: translateY(-1px); }
    button.secondary { background-color: var(--bg-tertiary); color: var(--text-main); padding: 4px 6px; }
    button.secondary:hover { background-color: #475569; }
    button.danger { background-color: rgba(239, 68, 68, 0.15); color: var(--danger); padding: 4px 6px; border: 1px solid rgba(239, 68, 68, 0.3); }
    button.danger:hover { background-color: var(--danger); color: #ffffff; }

    .status { font-size: 11px; color: var(--success); min-height: 14px; margin-top: 4px; text-align: center; font-weight: 500; }
    .list-container { max-height: 150px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
    .list-item { display: flex; justify-content: space-between; align-items: center; background: #0b1120; padding: 8px; border-radius: 6px; border: 1px solid rgba(255, 255, 255, 0.05); font-size: 11px; }
    .item-actions { display: flex; gap: 3px; }

    #lockScreen { display: flex; flex-direction: column; gap: 10px; text-align: center; padding: 10px 0; }
    #appContent { display: none; }

    .mail-preview {
      background: #0b1120; border: 1px solid var(--border); border-radius: 6px; padding: 8px; margin-top: 8px; font-size: 12px; display: none; max-height: 180px; overflow-y: auto;
    }

    .leak-banner {
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 8px;
      display: none;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- KİLİT EKRANI -->
  <div id="lockScreen">
    <div class="card" style="padding: 20px 14px;">
      <h2 style="font-size: 18px; margin-bottom: 8px; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Kasa Kilitli</h2>
      <p id="lockSubtitle" style="font-size: 12px; color: var(--text-muted); margin-bottom: 14px;">Kasanıza erişmek için ana şifrenizi girin.</p>
      
      <input type="password" id="masterPassInput" placeholder="Ana Şifre" style="margin-bottom: 10px;">
      <input type="password" id="masterPassConfirm" placeholder="Ana Şifreyi Doğrulayın" style="margin-bottom: 10px; display: none;">
      
      <button class="btn-primary" id="btnUnlock" style="width: 100%;">Kasayı Aç</button>
      <div id="lockStatus" class="status" style="color: var(--danger);"></div>
    </div>
  </div>

  <!-- ANA UYGULAMA İÇERİĞİ -->
  <div id="appContent">
    <div class="header">
      <h2>Kimlik & Şifre Asistanı</h2>
      <button class="secondary" id="btnLockApp">Kilitle 🔒</button>
    </div>

    <!-- Sekmeler -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="tab-generator">Hesaplar</button>
      <button class="tab-btn" data-tab="tab-cards">Kartlarım</button>
      <button class="tab-btn" data-tab="tab-notes">Notlar 🔐</button>
      <button class="tab-btn" data-tab="tab-tempmail">Canlı Posta</button>
    </div>

    <!-- SEKME 1: HESAP & ŞİFRE YÖNETİMİ -->
    <div id="tab-generator" class="tab-content active">
      <div class="card">
        <label>Şifre Seçenekleri</label>
        <div class="slider-container">
          <span style="font-size: 11px; color: var(--text-muted);">Uzunluk:</span>
          <input type="range" id="passLength" min="6" max="32" value="16">
          <span id="passLengthVal" class="slider-val">16</span>
        </div>

        <div class="checkbox-grid">
          <label class="checkbox-label"><input type="checkbox" id="chkUpper" checked> Büyük Harf</label>
          <label class="checkbox-label"><input type="checkbox" id="chkLower" checked> Küçük Harf</label>
          <label class="checkbox-label"><input type="checkbox" id="chkNumbers" checked> Rakamlar</label>
          <label class="checkbox-label"><input type="checkbox" id="chkSymbols" checked> Semboller</label>
        </div>

        <label>Hızlı Şifre Üretici</label>
        <div class="output-box">
          <input type="text" id="genPassOut" readonly placeholder="Şifre üret">
          <button class="btn-primary" id="btnGenPass">Üret</button>
          <button class="secondary" id="btnUseGenPass">Forma Al</button>
        </div>
      </div>

      <div class="card">
        <label id="accountFormTitle">Hesap Bilgisi Ekle / Düzenle</label>
        <input type="hidden" id="editAccountId">

        <input type="text" id="siteName" list="popularSites" placeholder="Site Adı veya Seç (örn: Google, Netflix...)" style="margin-bottom: 6px;">
        <datalist id="popularSites">
          <option value="google.com">Google</option>
          <option value="youtube.com">YouTube</option>
          <option value="instagram.com">Instagram</option>
          <option value="netflix.com">Netflix</option>
          <option value="x.com">X / Twitter</option>
          <option value="spotify.com">Spotify</option>
          <option value="trendyol.com">Trendyol</option>
          <option value="hepsiburada.com">Hepsiburada</option>
          <option value="amazon.com.tr">Amazon</option>
          <option value="github.com">GitHub</option>
          <option value="steamcommunity.com">Steam</option>
          <option value="discord.com">Discord</option>
        </datalist>

        <input type="text" id="accEmail" placeholder="E-Posta / Kullanıcı Adı" style="margin-bottom: 6px;">
        
        <div style="display: flex; gap: 6px; margin-bottom: 6px;">
          <input type="password" id="accPass" placeholder="Şifre" style="flex: 1;">
          <button class="secondary" id="btnCheckLeak" title="Bu şifre internete sızmış mı kontrol et">Sızıntı Tara 🔍</button>
        </div>

        <!-- Sızıntı Uyarı Alanı -->
        <div id="leakBanner" class="leak-banner"></div>

        <button class="btn-primary" id="btnSaveAccount" style="width: 100%;">Hesap Bilgisini Kaydet</button>
        <div id="accountStatus" class="status"></div>
      </div>

      <div class="card">
        <label>Kayıtlı Hesaplarım</label>
        <div id="savedAccountsContainer" class="list-container"></div>
      </div>
    </div>

    <!-- SEKME 2: KART YÖNETİMİ -->
    <div id="tab-cards" class="tab-content">
      <div class="card">
        <label id="cardFormTitle">Kart Bilgisi Ekle / Düzenle</label>
        <input type="hidden" id="editCardId">
        <input type="text" id="cardHolder" placeholder="Kart Üzerindeki İsim" style="margin-bottom: 6px;">
        <input type="text" id="cardNumber" placeholder="Kart Numarası (16 Hane)" inputmode="numeric" maxlength="19" style="margin-bottom: 6px;">
        <div style="display: flex; gap: 6px; margin-bottom: 8px;">
          <input type="text" id="cardExpiry" placeholder="AA/YY" inputmode="numeric" maxlength="5" style="flex: 1;">
          <input type="password" id="cardCvc" placeholder="CVC (3 Hane)" inputmode="numeric" maxlength="3" style="flex: 1;">
        </div>
        <button class="btn-primary" id="btnSaveCard" style="width: 100%;">Kart Bilgilerini Kaydet</button>
        <div id="cardStatus" class="status"></div>
      </div>

      <div class="card">
        <label>Kayıtlı Kartlarım</label>
        <div id="savedCardsContainer" class="list-container"></div>
      </div>
    </div>

    <!-- SEKME 3: KRİPTOLU GÜVENLİ NOTLAR -->
    <div id="tab-notes" class="tab-content">
      <div class="card">
        <label id="noteFormTitle">Güvenli Not Ekle / Düzenle</label>
        <input type="hidden" id="editNoteId">
        <input type="text" id="noteTitle" placeholder="Not Başlığı (örn: Wi-Fi Şifresi, API Key)" style="margin-bottom: 6px;">
        <textarea id="noteContent" placeholder="Gizli notunuz..." style="margin-bottom: 8px;"></textarea>
        <button class="btn-primary" id="btnSaveNote" style="width: 100%;">Notu Şifrele ve Kaydet</button>
        <div id="noteStatus" class="status"></div>
      </div>

      <div class="card">
        <label>Kayıtlı Notlarım</label>
        <div id="savedNotesContainer" class="list-container"></div>
      </div>
    </div>

    <!-- SEKME 4: CANLI GEÇİCİ POSTA -->
    <div id="tab-tempmail" class="tab-content">
      <div class="card">
        <label>Canlı Geçici E-Posta</label>
        <div class="output-box">
          <input type="text" id="tempEmailBox" readonly placeholder="Henüz üretilmedi">
          <button class="btn-primary" id="btnNewTempMail">Yeni</button>
          <button class="secondary" id="btnCopyTempMail">Kopyala</button>
        </div>
        <button class="secondary" id="btnUseTempInAccount" style="width: 100%; margin-bottom: 4px;">Bu E-Postayı Hesap Formuna Aktar</button>
      </div>

      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
          <label style="margin: 0;">Gelen Kutusu (Canlı)</label>
          <button class="secondary" id="btnRefreshInbox" style="font-size: 10px; padding: 3px 6px;">Yenile 🔄</button>
        </div>
        <div id="inboxContainer" class="list-container">
          <span style="font-size: 11px; color: #64748b;">Posta kutusu boş veya henüz kontrol edilmedi.</span>
        </div>

        <div id="mailDetailBox" class="mail-preview">
          <strong id="mailDetailSubject"></strong><br>
          <small id="mailDetailFrom" style="color: var(--text-muted);"></small>
          <hr style="border: 0; border-top: 1px solid var(--border); margin: 6px 0;">
          <div id="mailDetailBody" style="word-break: break-word;"></div>
          <button class="secondary" id="btnCloseMailDetail" style="margin-top: 8px; width: 100%;">Kapat</button>
        </div>
      </div>
    </div>

  </div>

  <script src="popup.js"></script>
</body>
</html>
